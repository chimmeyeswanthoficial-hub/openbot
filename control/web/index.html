    }

    }

    }
    async revoke() { const r = await this.#mutate('revoke-self', '/api/v1/session/revoke', {}); this.forget(); return r; }
  }
  return Object.freeze({Session, liveLocation, allowed, fixtures});

 small primary" data-execute="${esc(t.id)}" data-requires="execute">Request execution</button>`:''}${t.status==='completed'?`<button class="button small" data-artifact="${esc(t.id)}" data-requires="read">Read back artifact</button>`:''}${['review','queued','running'].includes(t.status)?`<button class="button small" data-cancel="${esc(t.id)}" data-requires="cancel">Request stop</button>`:''}</div></article>`).join(''):'<section class="panel"><h3>No authoritative task records loaded.</h3><p class="inline-note">Local chat briefs do not become server work automatically. Pair, refresh, and explicitly propose a fixed owned sample.</p></section>'}</div>${i.pairing?`<details class="panel"><summary>Scoped audit read-back · ${gateway.snapshot.audit.length} records</summary><pre id="server-audit">${esc(JSON.stringify(gateway.snapshot.audit,null,2))}</pre></details><details class="panel"><summary>Canonical exact-book source · not a bank balance or settled earnings</summary><p class="inline-note">Last scoped server read-back, not the imported spending CSV. Integer minor-unit strings are shown without conversion to floating-point money. This is not permission to spend.</p><pre id="server-book">${esc(JSON.stringify(gateway.snapshot.exact_book,null,2))}</pre></details>`:''}<p class="inline-note">Unknown/refused write outcome? Refresh and inspect the server. No implicit replay, approval, execution or provider retry is performed.</p></div>`;}

 function renderTrust(){return `<div class="page">${heading('ONE SHARED INTERFACE. HONEST STATUS.','Your workspace. Your boundaries.','The supplied reference now guides the light three-column desktop layout and the companion-list / conversation mobile flow. Shared HTML is bundled for Windows, Android and iOS; OS chrome, signing and device acceptance are separate.')}<section class="panel source-card"><div><h2>One current-source workspace</h2><p>The clean source includes the kernel, shared UI, native shell source, notices, tests, roadmap and separate owner/Antigravity instructions. It is not a runtime backup, native release signature or public-product approval.</p></div>${status?.source_download_available?`<a class="button primary" href="/source.zip" download="OpenBot-Workspace-current-source.zip">${icon('download')}Download current source</a>`:'<button class="button" disabled>Source ZIP not attached here</button>'}</section><div class="trust-grid"><section class="panel"><h2>Local data controls</h2><label class="setting-row"><input type="checkbox" id="remember-drafts"${state.remember?' checked':''}><span>Remember non-secret work briefs, custom blueprint requests and routine requests in this browser. Off by default; unencrypted, not authenticated approvals. Never stores financial CSV imports, device keys, pairing/review codes or authoritative task receipts.</span></label><p class="inline-note">${legacyPresent?'Earlier Studio v1 browser data was detected and left untouched. It is not silently imported or deleted.':''} Restored requests are unvalidated; no running service is recreated. Native test shells block file selection/downloads and may block browser storage. Paste permitted text for local work; use the browser for file imports/exports.</p><button class="button danger small" id="clear-drafts">Clear this interface’s local drafts</button></section><section class="panel"><h2>What is real?</h2><ul class="review-list"><li>Local briefs, requests, social review and the attributed OpenMuse read-only CSV parser.</li><li>Authenticated fixed-owned QA integration when this exact client is served by the gateway; local disposable HTTPS evidence is not production pairing.</li><li>Windows unsigned test build / Android demo-signed test build only when measured package receipts exist. iOS needs Mac/Xcode; browser WebKit is not iPhone acceptance.</li><li>0 connected model teammates, real PCs, IDE sessions or social accounts are implied.</li></ul></section><section class="panel"><h2>Useful reuse, not everything copied</h2><p class="muted">OpenMuse’s MIT CSV parser/test vectors are actually adapted. OpenDots/Rakazo/Bot HQ remain at their recorded selective-review/adoption boundaries. The reference-inspired interface and letter avatars are original. No closed source, branded artwork or service entitlement is copied.</p><p class="inline-note">Unintegrated upstream reference code is not an installed agent runtime. Exact notices and selected hashes are recorded in the source handoff.</p></section><section class="panel"><h2>Public release remains blocked</h2><p class="muted">R01–R13 are tracked in PUBLIC_RELEASE_ROADMAP.md. Real providers/hosts/PCs/social, native devices/signing, independent security, witnessed operations, protected evaluation, the real 1–6-month pilot including 30 consecutive observed days, and human release remain gates.</p><p class="inline-note">Accepted real observed pilot days: <b>0</b>. Engineering is done in active sessions; no claim of unattended background progress.</p></section></div></div>`;}

 async function api(path,body){if(gateway.enabled||!/^https?:$/.test(location.protocol)||location.hostname==='openbot-offline.invalid')throw Error('Local planning validator unavailable in this host. Use the included CLI; no successful validation is claimed.');const c=new AbortController(),timer=setTimeout(()=>c.abort(),5000);try{const r=await fetch(path,{method:'POST',credentials:'omit',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:c.signal});const v=await r.json();if(!r.ok)throw Error(typeof v.error==='string'?v.error.replaceAll('_',' '):'Draft refused');return v;}catch(error){if(error instanceof TypeError||error.name==='AbortError')throw Error('Local validator unavailable. Draft retained; nothing was sent to a provider or published.');throw error;}finally{clearTimeout(timer);}}
 function canonical(v){if(v===null||typeof v!=='object')return JSON.stringify(v);if(Array.isArray(v))return '['+v.map(canonical).join(',')+']';return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canonical(v[k])).join(',')+'}';}
 async function verifyPlan(p,schema){if(!p||p.schema!==schema||p.authority!=='planning_only'||!/^[a-f0-9]{64}$/.test(p.sha256))throw Error('Invalid plan contract');if(schema==='openbot.social-review/1'&&(p.account_connected!==false||p.external_write_enabled!==false||p.transport_request!==null||p.no_ban_guarantee!==false))throw Error('Unexpected publishing capability refused');if(schema==='openbot.companion-blueprint/1'&&(p.vm_started!==false||p.model_connected!==false||p.execution_authorized!==false))throw Error('Unexpected execution capability refused');const base=Object.fromEntries(Object.entries(p).filter(([k])=>k!=='sha256'));const raw=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(canonical(base)));if(Array.from(new Uint8Array(raw),b=>b.toString(16).padStart(2,'0')).join('')!==p.sha256)throw Error('Plan integrity mismatch');return p;}

 document.addEventListener('click',async event=>{const b=event.target.closest('button,a');if(!b)return;

  switch(b.id){

   case 'mobile-back':state.mobileThread=false;state.details=false;render();break;
   case 'show-computer':if(matchMedia('(min-width:1151px)').matches)state.detailsHidden=!state.detailsHidden;else state.details=!state.details;render();break;
   case 'hide-details':case 'close-details':state.details=false;state.detailsHidden=true;render();break;
   case 'focus-composer':$('#brief-input')?.focus();break;
   case 'save-brief':saveBrief();break;
   case 'view-example':state.example=true;render();break;
   case 'leave-example':state.example=false;render();break;
   case 'voice-info':showModal('Voice is not connected.', '<p class="modal-copy">The microphone button is a setup affordance, not an active recorder or voice agent. This build does not request microphone access, send audio, make calls or synthesize a live teammate. Voice requires separate implementation, consent and native acceptance.</p>');break;
   case 'attach-menu':showModal('Add something useful.',`<p class="modal-copy">Local attachments are not uploaded or automatically assigned.</p><div class="actions"><button class="button" id="choose-brief">${icon('file')}Read local .txt / .md</button><button class="button" id="modal-owned-qa">${icon('shield')}Propose owned QA</button><button class="button" data-view="social">${icon('social')}Review a social draft</button></div>`);break;
   case 'choose-brief':closeModal();if(nativeHost)toast('File selection is disabled in this native test shell. Paste an allowed work brief instead.');else $('#brief-file').click();break;
   case 'modal-owned-qa':closeModal();go('work');newQADialog();break;
   case 'create-companion':await createCompanion();break;
   case 'computer-settings':case 'computer-settings-secondary':computerDialog();break;
   case 'download-companion':{const c=selected();if(download(c.plan?'OpenBot-companion-blueprint.json':'OpenBot-companion-request-unvalidated.json',c.plan||requestFor(c)))toast(c.plan?'Planning blueprint download requested; not installation/execution approval.':'Unvalidated request download requested. No PC, provider or IDE was started.');break;}
   case 'save-routine':{const name=$('#routine-name').value.trim(),time=$('#routine-time').value,zone=$('#routine-zone').value.trim();try{if(!name||!safeText(name,64)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(time)||!safeText(zone,64))throw Error();new Intl.DateTimeFormat('en',{timeZone:zone});state.routines[b.dataset.key]={name,time,zone};save();download('OpenBot-routine-request-not-scheduled.json',{schema:'openbot.routine-request/1',companion:state.selected,name,requested_time:time,time_zone:zone,scheduler_connected:false,execution_authorized:false});closeModal();renderDetails();toast(nativeHost?'Routine request saved in tab memory. Native downloads are disabled; no job was scheduled.':'Routine request saved; JSON download requested. No job was scheduled.');}catch(_){$('#routine-error').textContent='Use a non-secret name, a valid local time and an IANA time zone.';}break;}
   case 'review-social':await reviewSocial();break;
   case 'download-review':if(state.socialPlan&&state.socialAck)download('OpenBot-social-review-not-publishing-approval.json',{plan:state.socialPlan,local_review_acknowledgement:true,authenticated_approver:null,execution_authorized:false});break;
   case 'pair-device':pairDialog();break;
   case 'pair-submit':{const code=$('#pair-code').value,label=$('#device-label').value;$('#pair-code').value='';b.disabled=true;try{const fresh=await gateway.pair(code,label);closeModal();render();toast(fresh?'Server-defined device scope read back. No model or companion account was connected.':'Pairing succeeded but read-back is unavailable. Mutations remain disabled; refresh before acting.');}catch(error){if($('#pair-error'))$('#pair-error').textContent=error.message;else toast(error.message);}finally{if($('#pair-submit'))$('#pair-submit').disabled=false;}break;}
   case 'refresh-server':await gateway.refresh();render();break;
   case 'revoke-session':await mutate(()=>gateway.revoke(),'Session revoked on the server.');break;
   case 'new-qa':newQADialog();break;
   case 'inspect-prior-proposal':closeModal();await gateway.refresh();go('work');break;
   case 'ack-new-proposal':pendingProposal=null;closeModal();newQADialog();break;
   case 'propose-submit':{if(!$('#rights').checked){$('#proposal-error').textContent='Explicit testing-rights and method consent are required.';break;}const body={request_id:uuid(),fixture:$('#fixture').value,goal:$('#goal').value,acceptance:$('#acceptance').value,rights_ref:'owned:first-party-seed',ai_use_approved:true,destination:'local-review'};pendingProposal=body;b.disabled=true;try{await gateway.propose(body);pendingProposal=null;closeModal();const fresh=await gateway.refresh();go('work');toast(fresh?'Server proposal read back. Separate exact review and execution are still required.':'Proposal response received, but read-back failed. Refresh and inspect; do not resubmit automatically.');}catch(error){if($('#proposal-error'))$('#proposal-error').textContent='Outcome requires read-back; no retry. '+error.message;else toast(error.message);}finally{if($('#propose-submit'))$('#propose-submit').disabled=false;}break;}
   case 'approve-submit':{const code=$('#reauth-code').value,id=b.dataset.id,digest=b.dataset.digest;$('#reauth-code').value='';closeModal();await mutate(()=>gateway.taskAction('approve',id,digest,code),'Exact approval read back. Execution is a separate request.');break;}
   case 'confirm-execute':{const id=b.dataset.id,digest=b.dataset.digest;closeModal();await mutate(()=>gateway.taskAction('execute',id,digest),'Execution outcome read back. Inspect the local artifact; no human acceptance is implied.');break;}
   case 'clear-drafts':showModal('Clear this interface’s local drafts?',`<p class="modal-copy">Remove this interface’s briefs, custom blueprints, routine requests and in-memory financial imports. Previous Studio v1 storage, source files, real accounts and server tasks are not deleted. This is not secure erasure.</p><div class="actions"><button class="button danger" id="confirm-clear">Clear these local drafts</button><button class="button" id="modal-close-secondary">Keep drafts</button></div>`);break;
   case 'modal-close-secondary':closeModal();break;
   case 'confirm-clear':spending.clear();briefReadEpoch++;state=initial();state.view='trust';state.mobileThread=true;save();closeModal();render();toast('This interface’s local drafts cleared. Source files, historical v1 storage and server records were not touched.');break;
  }
 });
 document.addEventListener('input',event=>{const t=event.target;if(spending.input(t))return;if(t.id==='contact-search')renderContacts();if(t.id==='brief-input'){briefReadEpoch++;state.drafts[state.selected]=t.value;}if(Object.values(socialFields).includes(t.id)){readSocial();invalidateSocial();}});
 document.addEventListener('change',async event=>{const t=event.target;if(t.id==='finance-file'){await spending.readFile(t);return;}if(spending.input(t))return;if(t.id==='remember-drafts'){state.remember=t.checked;save();toast(state.remember?'Non-secret browser drafts enabled. Financial imports and device/review keys/codes are excluded.':'Browser saving disabled; current tab drafts remain.');}if(t.id==='social-ack'){state.socialAck=t.checked;$('#download-review').disabled=!t.checked;}if(Object.values(socialFields).includes(t.id)){readSocial();invalidateSocial();}if(t.id==='brief-file'&&t.files.length){const file=t.files[0],epoch=++briefReadEpoch,companion=state.selected;t.value='';if(file.size>32768||!(/\.(txt|md)$/i.test(file.name))){toast('Choose a .txt or .md brief no larger than 32 KiB.');return;}try{const text=new TextDecoder('utf-8',{fatal:true}).decode(await file.arrayBuffer());if(!safeText(text))throw Error();if(epoch!==briefReadEpoch||companion!==state.selected||state.view!=='chat'){toast('Late file read discarded because the draft, companion or view changed.');return;}state.drafts[companion]=text;go('chat');$('#brief-input').focus();toast('Read locally into the composer. Not saved, uploaded or sent.');}catch(_){toast('File refused: invalid UTF-8, binary text, possible credentials or more than 12,000 characters.');}}});
 document.addEventListener('submit',event=>event.preventDefault());
 document.addEventListener('keydown',event=>{if(event.key==='Escape'&&$('#modal').open){event.preventDefault();closeModal();return;}if(event.key==='Escape'&&state.details&&!$('#modal').open){state.details=false;render();$('#show-computer').focus();}if((event.ctrlKey||event.metaKey)&&event.key==='Enter'&&event.target.id==='brief-input'){event.preventDefault();saveBrief();}});
 $('#modal').addEventListener('cancel',()=>{if(modalKind==='pair'&&gateway.busy)gateway.invalidate('Pairing UI cancelled; inspect server sessions before retrying.');});
 window.openbotBack=()=>{if($('#modal').open){closeModal();return true;}if(state.details){state.details=false;render();return true;}if(state.view!=='chat'){go('chat');return true;}if(state.mobileThread){state.mobileThread=false;render();return true;}return false;};
 addEventListener('openbotpause',()=>{for(const id of ['reauth-code','pair-code']){const code=$('#'+id);if(code)code.value='';}gateway.invalidate('App paused; fresh authenticated read-back required.');});
 addEventListener('openbotresume',()=>{void gateway.refresh();});addEventListener('offline',()=>gateway.invalidate('Offline; mutations disabled.'));addEventListener('online',()=>{void gateway.refresh();});
 document.addEventListener('visibilitychange',()=>{if(document.hidden)gateway.invalidate('Backgrounded; mutations disabled.');else void gateway.refresh();});
 setInterval(()=>{if(gateway.enabled&&gateway.pairing&&!document.hidden&&!gateway.busy)void gateway.refresh();},10000);
 setInterval(renderAuthority,1000);
 async function observe(){if(gateway.enabled){try{await gateway.identify();if(state.view==='connection')render();}catch(_){}}else if(/^https?:$/.test(location.protocol)&&location.hostname!=='openbot-offline.invalid'){try{const c=new AbortController(),timer=setTimeout(()=>c.abort(),4000);let response;try{response=await fetch('/api/status',{credentials:'omit',cache:'no-store',signal:c.signal});}finally{clearTimeout(timer);}const v=await response.json();if(response.ok&&v.schema==='openbot.studio-preview/1'&&v.model_connected===false&&v.public_writes_enabled===false&&v.vm_started===false&&v.private_store_exposed===false){status=v;if(state.view==='trust')render();}}catch(_){}}}
 // Read-only status used by tests and diagnostics; no key, code, grant or authority hook.
 Object.defineProperty(window,'OpenBotWorkspace',{value:Object.freeze({version:'0.5.0-reference',get connection(){return gateway.info();},get taskCount(){return gateway.snapshot.tasks.length;}}),writable:false});
 restore();const route=location.hash.slice(1);if(Object.hasOwn(views,route)&&route!=='chat'){state.view=route;state.mobileThread=true;}render();void observe();
})();
