[project]
name = "openbot-os"
version = "0.1.0"
description = "A self-hosted, self-evolving agent company: governed routines, ventures, ledger and incidents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["services/sentinel/tests", "services/worker/tests", "services/ledger/tests", "packages/venture-sdk/tests", "services/gateway/tests", "services/media-api/tests", "scripts/tests"]
pythonpath = ["services/sentinel", "services/worker/src", "services/ledger/src", "packages/venture-sdk/src", "services/gateway/src", "services/media-api/src", "scripts"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["repos", "node_modules", "archive", ".openbot/runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"services/sentinel/policy.py" = ["SIM102"]
